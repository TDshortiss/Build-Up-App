<title>Fall Line Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: app shell. Masthead with countdown and 7-week load profile, segmented nav, then a two-column session view (workout + sidebar) that stacks on phones. Effort uses trail-map symbols: green circle, blue square, black diamond. */
:root {
  --bg: #F2F4F5;
  --surface: #FFFFFF;
  --sunk: #E8ECEE;
  --ink: #15212B;
  --muted: #5A6874;
  --line: #D6DDE2;
  --accent: #C9420E;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE6DC;
  --green: #1E874A;
  --blue: #1F5FBF;
  --diamond: #15212B;
  --p1: #8DB0CB;
  --p2: #3C73A0;
  --p3: #C9420E;
  --warn: #A15C00;
  --warn-soft: #FFF1D6;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --surface: #16212A; --sunk: #1C2832; --ink: #E5EBEF; --muted: #92A2AE; --line: #283641;
    --accent: #FF7A3D; --accent-ink: #1A0D06; --accent-soft: #3A2116;
    --green: #3DBE74; --blue: #5B9BFF; --diamond: #E5EBEF;
    --p1: #4F7390; --p2: #6FA3D0; --p3: #FF7A3D;
    --warn: #F2B24C; --warn-soft: #33270F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B; --surface: #16212A; --sunk: #1C2832; --ink: #E5EBEF; --muted: #92A2AE; --line: #283641;
  --accent: #FF7A3D; --accent-ink: #1A0D06; --accent-soft: #3A2116;
  --green: #3DBE74; --blue: #5B9BFF; --diamond: #E5EBEF;
  --p1: #4F7390; --p2: #6FA3D0; --p3: #FF7A3D;
  --warn: #F2B24C; --warn-soft: #33270F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 64px; }
@media (max-width: 480px) { .wrap { padding-inline: 16px; } }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.05; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Masthead */
.mast { display: grid; grid-template-columns: 1fr auto; gap: 20px 32px; align-items: end; padding-block: 8px 20px; border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.brand h1 { font-size: clamp(44px, 8vw, 72px); font-weight: 700; letter-spacing: -.01em; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand p { color: var(--muted); max-width: 52ch; }
.count { display: flex; gap: 18px; align-items: flex-end; }
.count .big { font-family: var(--display); font-weight: 700; font-size: 64px; line-height: .85; font-variant-numeric: tabular-nums; }
.count .sub { display: flex; flex-direction: column; gap: 2px; padding-bottom: 2px; }
.count .sub strong { font-family: var(--display); font-size: 22px; font-weight: 600; line-height: 1.1; }
.sync { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-s="synced"]::before { background: var(--green); }
.sync[data-s="error"]::before { background: var(--warn); }
@media (max-width: 720px) { .mast { grid-template-columns: 1fr; } .count .big { font-size: 52px; } }

/* Load profile */
.profile { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding-block: 18px 6px; }
.wk { display: flex; flex-direction: column; gap: 6px; align-items: stretch; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.wk .bar-track { height: 54px; display: flex; align-items: flex-end; border-bottom: 1px solid var(--line); }
.wk .bar { width: 100%; border-radius: 4px 4px 0 0; transition: filter .15s; }
.wk:hover .bar { filter: brightness(1.08); }
.wk .wl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.wk.now .wl { color: var(--ink); font-weight: 500; }
.wk.now .bar-track { border-bottom: 2px solid var(--ink); }
.wk .chk { color: var(--green); }
.phases { display: grid; grid-template-columns: 3fr 2fr 2fr; gap: 6px; }
.phases div { font-size: 12px; color: var(--muted); border-top: 3px solid; padding-top: 4px; font-family: var(--display); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }

/* Nav */
nav.tabs { display: flex; gap: 4px; margin-block: 22px 22px; background: var(--sunk); padding: 4px; border-radius: 999px; width: fit-content; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Effort symbols */
.eff { display: inline-block; width: 11px; height: 11px; flex: none; }
.eff.green { background: var(--green); border-radius: 50%; }
.eff.blue { background: var(--blue); }
.eff.black { background: var(--diamond); transform: rotate(45deg) scale(.82); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Session layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.weekbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper .wkname { font-family: var(--display); font-size: 22px; font-weight: 600; min-width: 92px; text-align: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--sunk); color: var(--ink); }
.pill i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-block: 14px 22px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 4px 7px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; }
.day .dn { font-family: var(--display); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .05em; }
.day .dd { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.day[aria-current="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.day.is-today .dn { color: var(--accent); }
.day.is-done::after { content: ""; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

.sess-head { display: flex; flex-direction: column; gap: 8px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.sess-head h2 { font-size: clamp(34px, 5vw, 46px); font-weight: 700; text-transform: uppercase; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 15px; }
.meta span { display: inline-flex; align-items: center; gap: 7px; }
.focus { max-width: 64ch; }
.banner { margin-top: 4px; padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); font-size: 15px; }

.block { padding-block: 22px 4px; }
.block-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.block-h h3 { font-size: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.block-h .note { font-size: 14px; color: var(--muted); }
ol.exs { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.ex { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.tick { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; margin-top: 1px; color: transparent; transition: background .12s, border-color .12s; }
.tick svg { width: 14px; height: 14px; }
.tick:hover { border-color: var(--muted); }
.ex.is-done .tick { background: var(--green); border-color: var(--green); color: #fff; }
.ex.is-done .ex-name { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.ex-top { display: flex; justify-content: space-between; gap: 6px 14px; align-items: baseline; flex-wrap: wrap; }
.ex-name { font-weight: 700; font-size: 17px; }
.ex-right { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.swap { font-size: 12px; font-weight: 600; color: var(--blue); border: 1px solid currentColor; border-radius: 4px; padding: 0 6px; margin-left: 4px; white-space: nowrap; vertical-align: 2px; }
.lb { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); font-family: var(--mono); }
.lb .plus { color: var(--ink); }
.lb .plan { font-size: 12px; color: var(--muted); white-space: nowrap; }
.lb input.is-set { border-color: var(--accent); }
.lb input { width: 72px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 14px; }
.dose { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--ink); background: var(--sunk); padding: 1px 8px; border-radius: 4px; white-space: nowrap; }
.cue { color: var(--muted); font-size: 15px; margin-top: 3px; max-width: 70ch; }
details.why { margin-top: 4px; font-size: 14px; }
details.why summary { cursor: pointer; color: var(--accent); font-weight: 600; width: fit-content; }
details.why p { margin-top: 4px; max-width: 70ch; }
details.why a { display: inline-block; margin-top: 4px; font-weight: 600; }

.finish { margin-top: 26px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; gap: 14px; }
.finish-row { display: flex; gap: 14px 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.pain { display: flex; flex-direction: column; gap: 6px; flex: 1 1 260px; min-width: 0; }
.pain label { font-weight: 600; }
.pain-row { display: flex; align-items: center; gap: 12px; }
.pain input[type=range] { flex: 1; accent-color: var(--accent); }
.pain output { font-family: var(--mono); font-weight: 500; min-width: 44px; text-align: right; }
.pain-msg { font-size: 14px; color: var(--muted); }
.pain-msg.warn { color: var(--warn); background: var(--warn-soft); padding: 6px 10px; border-radius: 6px; }
.btn { border: 0; border-radius: 999px; padding: 11px 22px; font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.done { background: var(--green); color: #fff; }

/* Sidebar */
aside { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.meter { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--green); border-radius: 99px; }
.stat-row { display: flex; justify-content: space-between; align-items: baseline; }
.stat-row b { font-family: var(--display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.rules { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
.rules b { display: block; }
.rules span { color: var(--muted); }

/* Plan grid */
.scroll-x { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.grid { border-collapse: collapse; width: 100%; min-width: 760px; }
.grid th, .grid td { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
.grid thead th { font-family: var(--display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 14px; color: var(--muted); padding: 10px 6px; }
.grid tbody th { width: 110px; padding: 10px 12px; border-left: 4px solid; }
.grid tbody th b { font-family: var(--display); font-size: 20px; display: block; line-height: 1; }
.grid tbody th small { color: var(--muted); font-size: 12px; }
.grid tr:last-child th, .grid tr:last-child td { border-bottom: 0; }
.cell { width: 100%; border: 1px solid transparent; background: none; border-radius: 6px; padding: 7px 8px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 3px; min-height: 58px; }
.cell:hover { background: var(--sunk); }
.cell .ct { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
.cell .cd { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.cell.is-today { border-color: var(--accent); }
.cell.is-done { background: color-mix(in srgb, var(--green) 12%, transparent); }
.cell.is-done .cd::after { content: " · done"; color: var(--green); font-weight: 500; }
.cell.rest { opacity: .7; }
.plan-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.phase-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 22px; }
@media (max-width: 800px) { .phase-cards { grid-template-columns: 1fr; } }
.phase-cards .card { border-top: 4px solid; }
.phase-cards ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 15px; display: flex; flex-direction: column; gap: 4px; }

/* Library */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.lib .card { gap: 6px; }
.lib .card h3 { font-size: 21px; text-transform: none; letter-spacing: 0; font-weight: 700; }
.tag { font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.lib .cue { margin: 0; color: var(--ink); }
.lib .wy { color: var(--muted); font-size: 14px; }
.lib a { font-weight: 600; font-size: 14px; margin-top: auto; padding-top: 4px; }

/* Tests */
.intro { color: var(--muted); max-width: 70ch; margin-bottom: 18px; }
table.tests { border-collapse: collapse; width: 100%; min-width: 680px; }
.tests th, .tests td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tests thead th { font-family: var(--display); text-transform: uppercase; letter-spacing: .06em; font-size: 14px; color: var(--muted); font-weight: 600; }
.tests .tname { font-weight: 700; }
.tests .thow { font-size: 13px; color: var(--muted); font-weight: 400; display: block; max-width: 42ch; }
.tests .side { font-family: var(--mono); font-size: 13px; color: var(--muted); width: 48px; }
.tests input { width: 92px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 15px; }
.tests .lsi td { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.tests .lsi .ok { color: var(--green); font-weight: 500; }
.tests .lsi .low { color: var(--warn); font-weight: 500; }
.tests tr.grp th { border-bottom: 0; padding-top: 16px; }
.target { font-family: var(--mono); font-size: 13px; white-space: nowrap; }

/* Season */
.season { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
@media (max-width: 900px) { .season { grid-template-columns: 1fr; } }
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.tl li { position: relative; padding-left: 34px; padding-bottom: 26px; }
.tl li::before { content: ""; position: absolute; left: 0; top: 5px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); }
.tl li.now::before { border-color: var(--accent); background: var(--accent); }
.tl .when { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.tl h3 { font-size: 26px; font-weight: 700; text-transform: uppercase; margin: 2px 0 6px; }
.tl p { max-width: 64ch; }
.tl ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.maint { margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .maint { grid-template-columns: 1fr; } }
.maint .card { padding: 14px; gap: 6px; }
.maint .card h4 { margin: 0; font-family: var(--display); font-size: 18px; text-transform: uppercase; letter-spacing: .04em; }
.mrow { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 5px; }
.mrow span:last-child { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: right; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-weight: 600; font-size: 14px; }
.field input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: 15px; }
.field small { color: var(--muted); font-size: 13px; }
.fine { font-size: 13px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="mast">
    <div class="brand">
      <h1>Fall <span>Line</span></h1>
      <p>Your Upper, Lower, Push, Pull and Legs split, rebuilt to heal your shins, strengthen hips, knees and ankles, stiffen the Achilles and get your legs ready for a full day on the mountain.</p>
    </div>
    <div class="count" id="count"></div>
  </header>

  <section aria-label="Seven-week load profile">
    <div class="profile" id="profile"></div>
    <div class="phases" id="phaseband"></div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-view="session" id="tab-session">Session</button>
    <button role="tab" data-view="plan" id="tab-plan">7-Week Plan</button>
    <button role="tab" data-view="library" id="tab-library">Exercises</button>
    <button role="tab" data-view="tests" id="tab-tests">Benchmarks</button>
    <button role="tab" data-view="season" id="tab-season">Season</button>
  </nav>

  <main id="view"></main>

<script>
/* ---------- Exercise library ---------- */
const EX = {
  "ankle-cars": { n: "Ankle CARs", j: "ankle", cue: "Draw the biggest, slowest circle you can with your toes. Keep the shin still.", why: "Keeps full ankle range available before you load it. Ski boots lock the ankle, so you want range in reserve for falls and for football." },
  "kneewall": { n: "Knee-to-Wall Mobilization", j: "ankle", cue: "Foot a hand-width from the wall. Drive the knee over the second toe to touch the wall, heel stays down.", why: "Ankle dorsiflexion. When it's limited, landing and squatting forces shift up into the knee and Achilles." },
  "hip-cars": { n: "Hip CARs", j: "hip", cue: "On hands and knees, lift one knee and trace the largest circle the hip allows. The pelvis does not move.", why: "Takes the hip capsule through full rotation. Ski turns and football cuts both rotate on a loaded hip." },
  "9090": { n: "90/90 Hip Switches", j: "hip", cue: "Sit with both knees bent to 90°. Rotate both knees to the other side with a tall chest. Hands off the floor when you can.", why: "Trains internal and external rotation together. Low internal rotation is a common driver of groin and knee strain." },
  "bandwalk": { n: "Banded Lateral Walk", j: "hip", cue: "Band around the knees, quarter squat, step sideways without letting the knees cave in.", why: "Wakes up the glute med, which keeps the knee tracking over the foot when you land, cut or carve." },
  "worlds": { n: "World's Greatest Stretch", j: "hip", cue: "Long lunge, hand inside the front foot, rotate the chest and reach to the ceiling. Then straighten the front leg.", why: "Hip flexor, adductor, hamstring and upper-back rotation in one movement." },
  "couch": { n: "Couch Stretch", j: "hip", cue: "Back knee against a wall, foot up behind you. Squeeze the glute and stay tall without arching the low back.", why: "Opens hip flexors and quads, which tighten from the flexed ski stance and from sitting." },
  "cossack": { n: "Cossack Squat", j: "hip", cue: "Wide stance, sit into one hip with the other leg straight and toes up. Bent-side heel stays down.", why: "Strength at the end of adductor and knee range, which is where groin strains and awkward ski falls happen." },
  "adductor-rock": { n: "Adductor Rock-Back", j: "hip", cue: "On hands and knees with one leg out to the side, rock the hips back toward your heel with a flat back.", why: "Gentle adductor length. Pairs with the Copenhagen plank for groin protection." },
  "pigeon": { n: "Elevated Pigeon", j: "hip", cue: "Front shin across a bench or bed, hips square. Fold forward over the shin until you feel the outer hip.", why: "Hip external rotation and glute length." },
  "deep-squat": { n: "Deep Squat Hold", j: "hip", cue: "Sit to the bottom of a squat, heels down, elbows pressing the knees out. Hold a post for balance if needed.", why: "Restores combined hip, knee and ankle flexion, the position you pass through every time you absorb a bump." },
  "copenhagen": { n: "Copenhagen Plank", j: "hip", cue: "Side plank with the top leg on a bench (knee on bench is easier, foot is harder). Lift the bottom leg up to meet it.", why: "The best-supported exercise for preventing groin strains in field sports." },
  "lateral-lunge": { n: "Lateral Lunge", j: "hip", cue: "Step wide to the side, sit into that hip with the foot flat and knee over toes, push back to start.", why: "Side-to-side strength for edging on skis and for cutting on the field." },
  "slrdl": { n: "Single-Leg RDL", j: "hip", cue: "Hinge at the hip on one leg, back leg long, hips square to the floor. Soft bend in the standing knee.", why: "Hamstring and glute strength with balance. Strong hamstrings protect the ACL when skiing and resist strains when sprinting." },
  "goblet": { n: "Goblet Squat", j: "knee", cue: "Dumbbell at your chest, sit between the heels, knees track over toes. Tempo 3-1-1.", why: "Clean squat mechanics under load and quad strength for long runs." },
  "spanish": { n: "Spanish Squat Hold", j: "knee", cue: "Heavy band behind both knees anchored to a post. Sit back until shins are vertical and thighs near parallel. Hold.", why: "High quad load with little knee shear. Isometrics settle patellar tendon pain and build tendon stiffness." },
  "squat": { n: "Back Squat", j: "knee", cue: "Bar on the upper back, brace, sit between the heels to at least parallel, drive up. Stop 2–3 reps short of failure.", why: "Your main knee and hip strength lift. Deep, loaded knee bend is exactly what long ski runs ask of your quads." },
  "trapbar": { n: "Trap-Bar Deadlift", j: "knee", cue: "Hips back, chest up, push the floor away. Stop 2–3 reps short of failure.", why: "Heavy whole-leg strength. Maximum strength sets the ceiling for power." },
  "split": { n: "Rear-Foot-Elevated Split Squat", j: "knee", cue: "Back foot on a bench. Drop the back knee straight down; the front knee may travel past the toes.", why: "Single-leg strength through full knee range. Moguls and crud demand deep knee bend under load." },
  "nordic": { n: "Nordic Hamstring Curl", j: "knee", cue: "Kneel with heels anchored. Lower your body forward as slowly as you can, catch with your hands, push back up.", why: "Eccentric hamstring strength. Cuts hamstring strain rates in football and supports the ACL." },
  "petersen": { n: "Petersen Step-Up", j: "knee", cue: "One foot on a low step, heel raised. Drive the knee forward past the toes to lift the other heel off the floor.", why: "Targets the inner quad and end-range knee extension, the base of a resilient knee." },
  "stepdown": { n: "Lateral Step-Down", j: "knee", cue: "Stand on a box, slowly lower the other heel to tap the floor. Keep the knee in line with the second toe.", why: "Knee control. A knee caving inward on landing is the classic ACL injury pattern." },
  "wallsit": { n: "Wall Sit", j: "knee", cue: "Back on the wall, thighs parallel to the floor. Progress by shifting weight left to right.", why: "Quad endurance. Skiing holds you in a flexed stance for minutes at a time." },
  "calf-iso": { n: "Isometric Calf Hold", j: "ankle", cue: "Straight knee, rise halfway onto the ball of the foot and hold under heavy load (Smith bar, loaded pack, or pushing up into a fixed bar).", why: "Heavy isometrics raise Achilles stiffness with very little irritation. This is the foundation for explosiveness." },
  "tibraise": { n: "Tibialis Raise", j: "ankle", cue: "Back against a wall, heels about 30 cm out. Lift the toes as high as possible, lower slowly.", why: "Strengthens the front of the shin to balance calf work, helps against shin splints, and is what you press into the boot tongue with." },
  "calf-raise-heavy": { n: "Heavy Slow Calf Raise", j: "ankle", cue: "Straight knee, full range off a step. 3 s up, 3 s down. The last rep should be hard.", why: "Heavy slow resistance remodels the Achilles and increases its stiffness and capacity." },
  "sl-balance": { n: "Single-Leg Balance", j: "ankle", cue: "One leg, soft knee. Progress to eyes closed, then onto a cushion or folded mat.", why: "Ankle proprioception. Balance training substantially lowers ankle sprain risk." },
  "ecc-calf": { n: "Eccentric Calf Raise", j: "ankle", cue: "Rise on two feet off a step, shift onto one, lower for 3 s below step level. Do half straight-knee, half bent-knee.", why: "The classic Achilles loading protocol. Builds tendon tolerance before the jumping work." },
  "soleus": { n: "Seated Soleus Raise", j: "ankle", cue: "Seated, knees at 90°, heavy load on the thighs. Raise the heels high, lower slowly.", why: "The soleus carries the most load in running and in a bent-knee ski stance, and it is usually undertrained." },
  "pogo": { n: "Pogo Hops", j: "power", cue: "Two-foot hops with stiff ankles and nearly straight knees. Bounce off the balls of the feet with minimal ground time.", why: "The core Achilles stiffness drill. Trains the tendon to store and return energy like a spring." },
  "sl-pogo": { n: "Single-Leg Pogos", j: "power", cue: "Pogos on one leg. Stay tall, land quietly, keep contacts quick.", why: "More elastic load per tendon, and single-leg reactivity for cutting." },
  "latline": { n: "Lateral Line Hops", j: "power", cue: "Feet together, hop side to side over a line as fast as you can, staying on the balls of the feet.", why: "Fast lateral ankle stiffness and footwork for edge changes and cuts." },
  "skater": { n: "Skater Bounds", j: "power", cue: "Bound sideways from one leg to the other. Land soft on the outside leg and stick it before the next bound.", why: "Lateral power and landing control. The closest dry-land match to carving and to cutting." },
  "broad": { n: "Broad Jump", j: "power", cue: "Swing the arms, jump as far forward as you can, land on both feet and hold 2 s.", why: "Horizontal power for acceleration. Doubles as a benchmark test." },
  "drop-jump": { n: "Drop Jump", j: "power", cue: "Step off a 30 cm box, land on both feet and rebound straight up with the shortest contact you can.", why: "Reactive strength. Turns tendon stiffness into usable explosiveness." },
  "latbox": { n: "Lateral Box Hops", j: "power", cue: "Hop side to side over a low box or bench (20–30 cm) continuously, staying light.", why: "Ski-specific power endurance that mimics the repeated lateral loading of linked turns." },
  "squat-jump": { n: "Squat Jump", j: "power", cue: "Squat to parallel, pause 1 s, jump as high as you can, land softly.", why: "Leg power from a bent-knee position, without a countermovement to help." },
  "sideplank": { n: "Side Plank", j: "core", cue: "Elbow under shoulder, hips high, body straight. Lift the top leg to add hip work.", why: "Lateral trunk and glute med. Keeps the pelvis level on one-leg landings." },
  "pallof": { n: "Pallof Press", j: "core", cue: "Band at chest height to your side. Press the hands straight out and resist the twist, knees bent as in a ski stance.", why: "Anti-rotation strength. The upper body stays quiet while the legs turn underneath." },
  "deadbug": { n: "Dead Bug", j: "core", cue: "On your back, low back pressed down. Slowly extend opposite arm and leg without the back lifting.", why: "Trunk control that carries over to landing and change of direction." },
  "z2": { n: "Zone 2 Cardio", j: "core", cue: "Bike, incline walk or easy jog at a pace you can hold breathing through your nose.", why: "Aerobic base. Faster recovery between runs and fresher legs at altitude." },
  "bike-int": { n: "Bike Intervals", j: "core", cue: "Hard but repeatable effort (about 8/10), then easy spin for the recovery period.", why: "A ski run lasts 1 to 3 minutes. These intervals train exactly that energy system." },
  "heel-walk": { n: "Heel Walks", j: "ankle", cue: "Walk on your heels with the toes pulled up as high as they go.", why: "Low-impact endurance for the muscle along the front of the shin. A standard shin splint rehab drill." },
  "legcurl-lying": { n: "Lying Leg Curl", j: "knee", cue: "Hips pinned to the pad, curl up fast, lower over 3 s.", why: "Hamstring strength that protects the knee. Pairs with RDLs and Nordics." },
  "legcurl-seated": { n: "Seated Leg Curl", j: "knee", cue: "Lean the torso forward slightly, curl fully, lower over 3 s.", why: "Trains the hamstrings at long length, the position most linked to strain protection." },
  "leg-ext": { n: "Explosive Leg Extension", j: "knee", cue: "Kick up fast, squeeze at the top, lower over 3 s. Back off if the front of the knee aches.", why: "Isolated quad strength. The quads absorb every ski turn." },
  "rdl": { n: "Romanian Deadlift", j: "hip", cue: "Soft knees, push the hips back until the hamstrings stop you, bar close to the legs.", why: "Posterior-chain strength for sprinting and for holding a forward ski stance." },
  "hipthrust": { n: "Hip Thrust", j: "hip", cue: "Upper back on a bench, chin tucked, drive through the heels to full lockout and pause.", why: "Glute strength for acceleration and for keeping the hips level on one leg." },
  "abductor": { n: "Hip Abduction Machine", j: "hip", cue: "Sit tall or lean slightly forward, push out, control the return.", why: "Glute med strength that stops the knees caving in on landings and turns." },
  "calf-explosive": { n: "Explosive Calf Raise", j: "ankle", cue: "Straight knee. Drive up fast, pause, lower over 2–3 s. No bouncing at the bottom while your shins heal.", why: "Fast force through the Achilles. The bridge between heavy calf work and jumping." },
  "hanging-lr": { n: "Hanging Leg Raise", j: "core", cue: "Hang still, curl the pelvis up as the legs rise, lower without swinging.", why: "Hip flexor and lower-ab strength for absorbing bumps." },
  "ab-crunch": { n: "Machine Ab Crunch", j: "core", cue: "Curl the ribs toward the hips. Don't pull with the arms.", why: "Trunk stiffness that transfers force from legs to upper body." },
  "rotation": { n: "Cable Rotation", j: "core", cue: "Arms long, rotate from the hips and trunk, control the return.", why: "Rotational power for throwing and tackling, and control for quick edge changes." },
  "incline": { n: "Incline Bench Press", j: "upper", cue: "Bench at 30–45°, shoulder blades pinned back, bar to the upper chest.", why: "Upper-chest and shoulder strength from your split." },
  "cable-fly": { n: "Seated Cable Fly", j: "upper", cue: "Soft elbows, hug the handles together, slow on the way back.", why: "Chest volume from your split with little joint stress." },
  "pullup": { n: "Weighted Pull-Up", j: "upper", cue: "Full hang to chin over the bar. Stop a rep before your form breaks.", why: "Back strength that protects the shoulders in falls and contact." },
  "pendlay": { n: "Pendlay Row", j: "upper", cue: "Torso near parallel, bar from the floor to the lower chest each rep, brace hard.", why: "Upper-back strength and a strong hinge position." },
  "lat-raise": { n: "High Cable Lateral Raise", j: "upper", cue: "Lead with the elbow, raise to shoulder height, slow down.", why: "Side delts from your split." },
  "oh-ext": { n: "Cable Overhead Extension", j: "upper", cue: "Elbows by the ears, stretch fully behind the head, extend.", why: "Long-head triceps from your split." },
  "bayesian": { n: "Bayesian Curl", j: "upper", cue: "Face away from the cable, arm behind you, curl without the elbow drifting forward.", why: "Biceps in the stretched position, from your split." },
  "wrist-curl": { n: "Wrist / Finger Curl", j: "upper", cue: "Let the bar roll to the fingertips, then curl it back up.", why: "Grip strength for poles, catching and tackling." },
  "pec-fly-low": { n: "Lower-Chest Pec Fly", j: "upper", cue: "Cables set high, bring the hands down and together toward the hips.", why: "Lower-chest work from your split." },
  "dips": { n: "Weighted Dip", j: "upper", cue: "Slight forward lean, lower until the upper arm is parallel, press up.", why: "Triceps and chest strength from your split." },
  "bench": { n: "Bench Press", j: "upper", cue: "Feet planted, shoulder blades back, touch the lower chest, press.", why: "Main pressing strength from your split." },

  "sa-tri": { n: "Single-Arm Triceps Extension", j: "upper", cue: "Elbow fixed, extend fully, control the return.", why: "Triceps from your split." },

  "cs-row": { n: "Chest-Supported Row", j: "upper", cue: "Chest on the pad, drive the elbows back, squeeze.", why: "Back work with no load on the lower back, which saves it for RDLs." },

  "preacher": { n: "Single-Arm Machine Preacher Curl", j: "upper", cue: "Armpit tight to the pad, full stretch at the bottom.", why: "Biceps isolation from your split." },
  "forearm-curl": { n: "Forearm Cable Curl", j: "upper", cue: "Forearms supported, curl the wrist only.", why: "Grip and forearm strength from your split." },

/* ---------- Persistence: account sync with on-device fallback ---------- */
let ref = null, saving = false, queued = false, dirty = false, timer = null;
function setSync(s) {

}

async function flush() {

  catch (e) { if (e && e.code === "invalid_argument") ref = null; setSync(e && e.code === "invalid_argument" ? "local" : "error"); }

}

(async () => {
  try {
    if (!window.claude || !window.claude.use) { setSync("local"); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) { setSync("local"); return; }
    const uid = await user.id();
    if (!uid) { setSync("local"); return; }
    ref = db.doc("data/users/" + uid + "/progress");
    let first = true;
    ref.onSnapshot(snap => {
      if (dirty || saving) return;

})();

/* Working weights: a weight set on a session applies to that session and every later one until changed again */
const LB_RE = /\s*·\s*(\+?)(\d+(?:\.\d+)?)(?:–\d+(?:\.\d+)?)?\s*lb/;

function weightFor(id, key, plan) {
  const log = S.wt[id] || {};
  if (log[key] != null) return { v: log[key], src: "set" };
  const cur = order(key);
  let best = -1, bv = null;
  for (const kk in log) { const i = order(kk); if (i < cur && i > best) { best = i; bv = log[kk]; } }
  if (bv != null) return { v: bv, src: "carried" };
  if (plan) return { v: plan.v, src: "plan" };
  if (S.last[id] != null) return { v: S.last[id], src: "carried" };
  return { v: null, src: "none" };
}
function lbInput(key, ck, id, name, dose) {
  const plan = planWt(dose), w = weightFor(id, key, plan);
  const hint = plan && w.src !== "plan" && w.v !== plan.v ? `<span class="plan">plan ${plan.v}</span>` : "";
  return `<label class="lb" title="Working weight. Changes carry forward to later weeks.">${plan && plan.plus ? '<span class="plus">+</span>' : ""}<input type="number" inputmode="decimal" min="0" step="any" id="lb-${key}-${ck}" class="${w.src === "set" ? "is-set" : ""}" data-lb="${ck}" data-ex="${id}" value="${w.v ?? ""}" placeholder="—" aria-label="Working weight for ${esc(name)}, pounds${plan && plan.plus ? " added" : ""}"><span>lb</span>${hint}</label>`;
}
function painMsg(v) {

    <div class="phase-cards">${[1, 2, 3].map(n => `
      <div class="card" style="border-top-color:${PHASES[n].color}">
        <span class="label">${PHASES[n].weeks}</span><h3>${PHASES[n].n}</h3><p>${esc(PHASES[n].goal)}</p>
        <ul>${PHASES[n].notes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      </div>`).join("")}
    </div>`;
}

function renderLibrary() {
  const ids = Object.keys(EX).filter(id => libFilter === "all" || EX[id].j === libFilter);
  document.getElementById("view").innerHTML = `
    <div class="chips" role="group" aria-label="Filter by area">
      ${[["all", "All"], ...Object.entries(JOINTS)].map(([v, l]) => `<button class="chip" data-filter="${v}" aria-pressed="${libFilter === v}">${esc(l)}</button>`).join("")}
    </div>
    <div class="lib">${ids.map(id => `
      <article class="card">
        <span class="tag">${esc(JOINTS[EX[id].j])}</span>
        <h3>${esc(EX[id].n)}</h3>
        <p class="cue">${esc(EX[id].cue)}</p>
        <p class="wy">${esc(EX[id].why)}</p>
        <a href="${demo(id)}" target="_blank" rel="noopener">Watch a demo ↗</a>
      </article>`).join("")}
    </div>`;
}

function tv(id, col) { const v = (S.tests[id] || {})[col]; return v === undefined || v === null ? "" : v; }
function lsi(id, col) {
  const l = parseFloat(tv(id + "_L", col)), r = parseFloat(tv(id + "_R", col));
  if (!(l > 0) || !(r > 0)) return "";
  const v = Math.round((Math.min(l, r) / Math.max(l, r)) * 100);
  return `<span class="${v >= 90 ? "ok" : "low"}">${v}%</span>`;
}
function renderTests() {
  const inp = (id, col, label) => `<td><input type="number" inputmode="decimal" min="0" step="any" id="t-${id}-${col}" data-test="${id}" data-col="${col}" value="${esc(tv(id, col))}" aria-label="${esc(label)}"></td>`;
  const rows = TESTS.map(t => {
    const head = `<th class="tname">${esc(t.n)} <span class="mono" style="font-weight:400;color:var(--muted)">(${t.unit})</span><span class="thow">${esc(t.how)}</span></th>`;
    if (!t.bi) return `<tr class="grp">${head}<td class="side"></td><td class="target">${esc(t.target)}</td>${TCOLS.map(([c, l]) => inp(t.id, c, t.n + " " + l)).join("")}</tr>`;
    return `<tr class="grp">${head}<td class="side">Left</td><td class="target">${esc(t.target)}</td>${TCOLS.map(([c, l]) => inp(t.id + "_L", c, t.n + " left " + l)).join("")}</tr>
      <tr><td></td><td class="side">Right</td><td></td>${TCOLS.map(([c, l]) => inp(t.id + "_R", c, t.n + " right " + l)).join("")}</tr>
      <tr class="lsi"><td></td><td class="side">LSI</td><td></td>${TCOLS.map(([c]) => `<td data-lsi="${t.id}-${c}">${lsi(t.id, c)}</td>`).join("")}</tr>`;
  }).join("");
  document.getElementById("view").innerHTML = `
    <p class="intro">Test before Week 1, after Week 3 and after Week 6, warmed up and fresh. LSI (limb symmetry index) is the weaker side as a percentage of the stronger side. Under 90% points to the side that needs extra single-leg work, and it's one of the clearest knee injury risk markers. Skip the hop test and broad jump until you pass the shin check.</p>
    <div class="scroll-x"><table class="tests">
      <thead><tr><th>Test</th><th></th><th>Target</th>${TCOLS.map(([, l]) => `<th>${l}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

function renderSeason() {
  const pp = pos();
  const inPrep = !pp.post;
  const end = dateOf(WEEKS, 5);
  const mcard = m => `<div class="card"><h4>${esc(m.t)}</h4>${m.items.map(([id, dose]) => `<div class="mrow"><span>${esc(EX[id].n)}</span><span>${esc(dose)}</span></div>`).join("")}</div>`;
  document.getElementById("view").innerHTML = `
  <div class="season">
    <ol class="tl">
      <li class="${inPrep ? "now" : ""}"><span class="when">${esc(fmt(parseD(S.start), { month: "short", day: "numeric" }))} – ${esc(fmt(end, { month: "short", day: "numeric" }))}</span>
        <h3>Ski prep</h3><p>Weeks 1–3 let your shins heal: your split stays, running and jumping stop, and conditioning moves to the bike. Weeks 4–5 build Strength, Week 6 is Power, and Week 7 tapers into your first ski day.</p></li>
      <li class="${!inPrep ? "now" : ""}"><span class="when">Ski season · through March</span>
        <h3>In-season maintenance</h3>
        <p>Keep Upper, Push and Pull from your split. Swap Lower and Legs for these two shorter sessions so your legs stay fresh for the mountain. Skip one after a big ski day and never train legs the day before you ski.</p>
        <div class="maint">${mcard(MAINT.A)}${mcard(MAINT.B)}</div></li>
      <li><span class="when">April – May</span><h3>Football off-season strength</h3>
        <ul><li>Heavy lower body 3× a week, same lifts as Phase 2</li><li>Nordics and Copenhagens stay in every week. Together they cut hamstring and groin injuries sharply</li><li>Start acceleration work: 10–20 m sprints, full recovery</li></ul></li>
      <li><span class="when">June – July</span><h3>Speed &amp; change of direction</h3>
        <ul><li>Max-velocity sprints at 30–40 m</li><li>Cutting drills: 5-10-5 shuttle, 45° and 90° cuts, deceleration practice</li><li>Plyos progress to single-leg bounds and hurdle hops</li><li>Position-specific conditioning</li></ul></li>
      <li><span class="when">August</span><h3>Preseason</h3>
        <ul><li>Gym drops to 2× a week, short and heavy</li><li>Keep the Primer as your pre-practice warm-up</li><li>Pogos and Nordics weekly through the season</li></ul></li>
    </ol>
    <aside>
      <div class="card">
        <h3>Your dates</h3>
        <div class="field"><label for="d-start">Program start</label><input type="date" id="d-start" value="${esc(S.start)}"><small>Week 1 begins on this day, and each week runs Upper, Lower, Rehab, Push, Pull, Legs, Rest from there.</small></div>
        <div class="field"><label for="d-ski">First ski day</label><input type="date" id="d-ski" value="${esc(S.ski)}"><small>Drives the countdown. Ideally the day after Week 7 ends.</small></div>
      </div>
      <div class="card">
        <h3>What you need</h3>
        <ul class="rules">
          <li><span>A step or box (20–30 cm) and a bench</span></li>
          <li><span>A heavy loop band and a mini band</span></li>
          <li><span>Dumbbells or kettlebell; trap bar if you have a gym</span></li>
          <li><span>A wall and something to anchor your heels for Nordics</span></li>
        </ul>
      </div>
      <p class="fine">General training guidance, not medical advice. Sharp pain, swelling, or pain that gets worse session to session means stop and see a physio or sports doctor.</p>
    </aside>
  </div>`;
}

function renderView() {
  renderTabs();
  ({ session: renderSession, plan: renderPlan, library: renderLibrary, tests: renderTests, season: renderSeason })[view]();
}
function renderAll() { renderMast(); renderView(); }

/* ---------- Events ---------- */
function go(v) { view = v; try { localStorage.setItem(KEY + ":view", v); } catch (e) {} renderView(); }
document.addEventListener("click", e => {
  if (e.target.closest(".lb")) return;
  const t = e.target.closest("[data-view],[data-goto],[data-day],[data-week],[data-tick],[data-complete],[data-filter],[data-shin]");
  if (!t) return;
  if (t.dataset.view) return go(t.dataset.view);
  if (t.dataset.goto) { const [w, d] = t.dataset.goto.split("-").map(Number); sel = { w, d }; go("session"); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (t.dataset.day !== undefined) { sel.d = Number(t.dataset.day); return renderSession(); }
  if (t.dataset.week) { sel.w = Math.min(WEEKS, Math.max(1, sel.w + Number(t.dataset.week))); return renderSession(); }
  if (t.dataset.filter) { libFilter = t.dataset.filter; return renderLibrary(); }
  if (t.dataset.tick) {
    const key = k(sel.w, sel.d), c = S.checks[key] = S.checks[key] || {};
    const on = !c[t.dataset.tick];
    if (on) c[t.dataset.tick] = true; else delete c[t.dataset.tick];
    t.setAttribute("aria-pressed", on);
    t.closest(".ex").classList.toggle("is-done", on);
    const total = document.querySelectorAll(".ex").length, ticked = Object.keys(c).length;
    document.getElementById("tickcount").textContent = ticked + "/" + total + " done";
    if (ticked === total && !S.done[key]) { S.done[key] = new Date().toISOString().slice(0, 10); persist(); renderAll(); return; }
    persist();
    return;
  }
  if (t.hasAttribute("data-shin")) { S.shinOk = !S.shinOk; persist(); renderAll(); return; }
  if (t.hasAttribute("data-complete")) {
    const key = k(sel.w, sel.d);
    if (S.done[key]) delete S.done[key]; else S.done[key] = new Date().toISOString().slice(0, 10);
    persist(); renderAll();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "pain") {
    const v = Number(e.target.value);
    document.getElementById("painout").textContent = v + "/10";
    const m = document.getElementById("painmsg"); m.textContent = painMsg(v); m.classList.toggle("warn", v > 3);
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "pain") { S.pain[k(sel.w, sel.d)] = Number(el.value); persist(); return; }
  if (el.dataset.lb) {
    const key = k(sel.w, sel.d), id = el.dataset.ex, log = S.wt[id] = S.wt[id] || {};
    if (el.value === "") delete log[key];
    else { log[key] = Number(el.value); S.last[id] = Number(el.value); }
    el.classList.toggle("is-set", el.value !== "");
    persist();
    return;
  }
  if (el.dataset.test) {
    const id = el.dataset.test, col = el.dataset.col;
    S.tests[id] = S.tests[id] || {};
    if (el.value === "") delete S.tests[id][col]; else S.tests[id][col] = Number(el.value);
    persist();
    const base = id.replace(/_[LR]$/, "");
    const cell = document.querySelector(`[data-lsi="${base}-${col}"]`);
    if (cell) cell.innerHTML = lsi(base, col);
    return;
  }
  if ((el.id === "d-start" || el.id === "d-ski") && /^\d{4}-\d{2}-\d{2}$/.test(el.value)) {
    S[el.id === "d-start" ? "start" : "ski"] = el.value;
    const p = pos(); sel = { w: p.w, d: p.d };
    persist(); renderMast();
  }
});

renderAll();
</script>
